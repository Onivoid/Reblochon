repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1000"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff
        args: [--fix]
        files: ^api/
      - id: ruff-format
        files: ^api/

  - repo: local
    hooks:
      - id: web-oxlint
        name: oxlint (web)
        entry: pnpm --dir web lint
        language: system
        pass_filenames: false
        files: ^web/
      - id: web-prettier
        name: prettier (web)
        entry: pnpm --dir web format:check
        language: system
        pass_filenames: false
        files: ^web/
