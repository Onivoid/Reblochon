services:
  db:
    image: postgres:16-alpine
    container_name: reblochon-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reblochon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reblochon}
      POSTGRES_DB: ${POSTGRES_DB:-reblochon}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - reblochon_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: reblochon-api
    restart: unless-stopped
    profiles: ["full"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-reblochon}:${POSTGRES_PASSWORD:-reblochon}@db:5432/${POSTGRES_DB:-reblochon}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ACCESS_MINUTES: ${JWT_ACCESS_MINUTES:-15}
      JWT_REFRESH_DAYS: ${JWT_REFRESH_DAYS:-14}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080}
      API_HOST: 0.0.0.0
      API_PORT: 8000
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    container_name: reblochon-web
    restart: unless-stopped
    profiles: ["full"]
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  reblochon_pg:
